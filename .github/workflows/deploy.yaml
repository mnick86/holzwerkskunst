name: deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22
          check-latest: true

      - name: Install dependencies
        run: npm install

      - name: Generate products
        run: npm run transform

      - name: Generate page
        run: npm run mustache

      - name: Build image studio
        run: npm run build:image

      - name: Verify catalog and links
        run: npm run check:site

      - name: Verify SEO output
        run: npm run check:seo

      - name: Verify branding
        run: npm run check:branding

      - name: Test SEO helpers
        run: npm run test:seo

      - name: Test website behavior
        run: npm run test:site

      - name: Test image descriptions without API calls
        run: npm run test:descriptions

      - name: Test image studio without remote API calls
        run: npm run test:image

      - name: Deploy
        if: success()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist/bootstrap
          publish_branch: gh-pages
          cname: holzwerkskunst.de
