name: deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 24
          check-latest: true

      - name: Install dependencies
        run: npm ci

      - name: Generate products
        run: npm run transform

      - name: Generate page
        run: npm run mustache

      - name: Build image studio
        run: npm run build:image

      - name: Verify catalog and links
        run: npm run check:site

      - name: Verify SEO output
        run: npm run check:seo

      - name: Verify branding
        run: npm run check:branding

      - name: Test SEO helpers
        run: npm run test:seo

      - name: Test website behavior
        run: npm run test:site

      - name: Test image descriptions without API calls
        run: npm run test:descriptions

      - name: Test image studio without remote API calls
        run: npm run test:image

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/bootstrap
          retention-days: 1

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
