id: glasanhaenger
name: Glasanhänger
description: |
  Personalisierte Glasanhänger geben jedem Platz am Festtisch einen Namen. Die filigranen Holzschriftzüge werden am Glas in Szene gesetzt und ergänzen die Tischdekoration um ein persönliches Detail. Für kirchliche Feiern lassen sich passende Symbole wie ein Fisch mit dem Namen kombinieren.

  Ob Hochzeit, Kommunion, Taufe, Geburtstag oder Silvesterfeier: Schrift und Gestaltung können auf den Anlass abgestimmt werden. Die Anhänger helfen den Gästen, ihren Platz oder ihr Glas wiederzuerkennen, und können als kleine Erinnerung mitgenommen werden. Namen und gewünschte Stückzahl besprechen wir mit dir.
tags:
