id: holzherzen
name: Holz-Herzen
description: |
  Ein Holzherz sagt auf persönliche Weise, wie viel dir ein Mensch bedeutet. Die gezeigten Gestaltungen verbinden eine offene Herzform mit Namen, kurzen Botschaften oder einem gravierten Bild. Je nach Ausführung lässt sich das Herz aufhängen oder auf einem Sockel aufstellen.

  Ob für Mama, zur Hochzeit, zum Geburtstag oder als liebevolles Dankeschön: Motiv und Worte machen daraus eine Erinnerung mit persönlichem Bezug. Wir besprechen mit dir, welche Form und Gestaltung deine Botschaft am besten trägt und ob sich ein gewünschtes Foto dafür eignet.
tags:
