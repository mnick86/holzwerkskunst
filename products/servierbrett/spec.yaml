id: servierbrett
name: Servierbrett aus Schiefer
description: |
  Ein Servierbrett aus Schiefer verbindet eine dunkle, natürliche Oberfläche mit einer persönlichen Gravur. Schriftzüge und Motive kommen darauf hell und kontrastreich zur Geltung. Die abgebildeten Beispiele zeigen eine Gestaltung für einen Grillmeister mit Namen und dekorativen Details.

  So wird das Brett beim Anrichten und Servieren zu einem persönlichen Blickfang auf dem Tisch. Es eignet sich als Geschenk zum Geburtstag, zum Vatertag oder für jemanden, der gerne Gäste bewirtet. Welche Namen, Worte und Motive du dir wünschst, besprechen wir gemeinsam.
