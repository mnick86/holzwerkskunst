id: glubbal
name: Glubbal
description: |
  Glubbal sind gravierte Wäscheklammern mit bayerischem Charme. Ein Name, Spitzname oder kurzer Spruch wird mit einem passenden Holzmotiv kombiniert. Die Beispiele zeigen unter anderem Fußballmotive, regionale Bezüge und humorvolle Botschaften für Tracht und gesellige Feste.

  Ob am Dirndl, an der Lederhose, als Namensschild bei einer Feier oder als Aufmerksamkeit für einen Verein: Die kleinen Klammern lassen sich vielseitig einsetzen. Auch für Firmen und Teams sind individuelle Gestaltungen möglich. Text, Motiv und Stückzahl stimmen wir persönlich mit dir ab.
