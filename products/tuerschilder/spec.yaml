id: tuerschilder
name: Türschilder
description: |
  Diese Türschilder aus Holz verbinden klare Beschriftungen mit bayerischen Motiven. Das gezeigte Paar stellt „Buam“ und „Madln“ als Figuren in Tracht dar und gibt den Türen einen humorvollen, regionalen Akzent. Die ausgeschnittenen Konturen lassen die Figuren gut zur Geltung kommen.

  Für Zuhause, einen Vereinsraum oder einen passenden Gastraum lässt sich eine eigene Gestaltung anfragen. Teile uns mit, welchen Text und welchen Stil du dir wünschst. Wir besprechen gemeinsam, welche Motive und Ausführungen zu den vorgesehenen Türen passen.
