id: schachteln
name: Schachteln
description: |
  Ein filigran ausgeschnittener Lebensbaum macht diese Holzschachteln zu dekorativen Aufbewahrungsorten für kleine Lieblingsstücke. Die Beispiele zeigen eine runde Dose mit abnehmbarem Deckel und eine rechteckige Schachtel mit Verschluss. Die natürliche Holzoptik lässt das Motiv auf dem Deckel besonders gut wirken.

  Ob für kleine Erinnerungen, persönliche Schätze oder als besondere Verpackung für ein Geschenk: Die Schachtel kann auch nach dem Anlass weiterverwendet werden. Welche Form und welche Gestaltung zu deiner Idee passen, besprechen wir im persönlichen Kontakt.
