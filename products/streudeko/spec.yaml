id: streudeko
name: Streudeko
description: |
  Kleine Holzmotive bringen ein gemeinsames Thema auf den Festtisch. Herzen, Zahlen und Motive rund ums Baby lassen sich zwischen Blumen, Geschirr und anderen Dekoelementen verteilen. Die Beispiele zeigen Streudeko zur Geburt, für runde Geburtstage und für eine romantische Tischgestaltung.

  Ob Hochzeit, Taufe, Kommunion oder Geburtstag: Die Motive können auf deinen Anlass abgestimmt werden. Wir besprechen mit dir, welche Formen und welche Stückzahl du für deine Dekoration benötigst. So entsteht eine Tischgestaltung, bei der auch die kleinen Details zusammenpassen.
tags:
