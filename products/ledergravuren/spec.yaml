id: ledergravur
name: Ledergravuren
description: |
  Eine Gravur auf Leder verleiht einem Gegenstand eine persönliche Botschaft und einen markanten Look. Die abgebildeten Beispiele zeigen einen runden Lederuntersetzer und einen lederbezogenen Flachmann mit einem Motiv zum runden Geburtstag. Schrift und Linien heben sich deutlich von der Lederoberfläche ab.

  Ein Name, eine Jahreszahl, ein kurzer Spruch oder ein geeignetes Logo kann die Gestaltung bestimmen. Das eignet sich für Geburtstage, den Vatertag oder einen besonderen Anlass im Verein. Welcher Gegenstand und welches Motiv für deine Idee infrage kommen, klären wir gemeinsam.
tags:
