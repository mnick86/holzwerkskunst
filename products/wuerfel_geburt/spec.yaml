id: wuerfel_geburt
name: Geburtswürfel
description: |
  Die ersten Daten eines neuen Lebens bekommen mit diesen Geburtswürfeln einen besonderen Platz. Name, Geburtsdatum, Uhrzeit, Gewicht und Größe werden auf die Holzflächen graviert. Buchstaben, Symbole und persönliche Motive ergeben zusammen eine dekorative Erinnerung an die Geburt.

  Die Würfel lassen sich im Regal oder auf einer Kommode arrangieren und eignen sich als Geschenk für frischgebackene Eltern oder zur Taufe. Du teilst uns die gewünschten Angaben mit; wir besprechen die Verteilung der Texte und Motive auf den einzelnen Würfeln.
tags:
