id: caketopper
name: Individuelle Caketopper
description: |
  Mit einem individuellen Caketopper bekommt deine Torte eine persönliche Botschaft. Namen, Zahlen und passende Motive machen den Kuchen zum Mittelpunkt der Feier. Die Holzstecker lassen sich auf unterschiedliche Anlässe abstimmen, etwa auf eine Hochzeit, einen Geburtstag, die Kommunion oder die Einschulung.

  Von einem schlichten Schriftzug bis zu einer Gestaltung mit Blumen, Schultüte oder anderen Motiven ist vieles möglich. Wir besprechen den gewünschten Text und das Motiv mit dir, damit der Topper zum Anlass und zum Stil deiner Feier passt.
tags:
  - Hochzeit
  - Geburtstag
  - Kommunion
  - Taufe
  - Schule
date: '2024-01-05'
