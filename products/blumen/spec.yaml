id: holzblumen
name: Holzblumen
description: |
  Ein Blumengruß aus Holz, der einen besonderen Platz im Alltag bekommt. Die filigranen Blüten werden in einen Holzsockel gesteckt und bilden zusammen ein dekoratives Arrangement. Unterschiedliche Blumenformen geben dem Aufsteller seinen eigenen Charakter.

  Auf dem Sockel ist Platz für einen persönlichen Gruß, einen Namen oder eine Widmung. So lässt sich der Blumengruß zum Geburtstag, zum Muttertag, zur Hochzeit oder einfach als Dankeschön gestalten. Ob für die Fensterbank oder den Schreibtisch: Die Botschaft bleibt auch dann sichtbar, wenn der Anlass längst vorbei ist.
tags:
