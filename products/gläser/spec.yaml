id: glaeser
name: Gläser
description: |
  Ein Geschenkglas mit graviertem Holzdeckel verbindet eine kleine Aufmerksamkeit mit persönlichen Worten. Auf dem Deckel finden Namen, Motive oder kurze Botschaften Platz – von einem lieben Gruß bis zum Dankeschön für einen besonderen Menschen. Die Beispiele zeigen Gläser mit süßen Kleinigkeiten und dekorativen Details.

  Als Geburtstagsgruß, für Mama, für Freunde oder als Dankeschön für Hilfe im Alltag bekommt jedes Glas seine eigene Bedeutung. Welche Beschriftung und Ausführung du dir wünschst, besprechen wir gemeinsam. Inhalt und Dekoration stimmen wir dabei gesondert mit dir ab.
tags:
