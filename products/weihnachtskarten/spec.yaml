id: weihnachtskarten
name: Weihnachtskarten
description: |
  Diese Weihnachtskarten aus Papier setzen auf filigran ausgeschnittene Motive statt auf ein gedrucktes Bild allein. Tannenbäume, Sterne und winterliche Szenen heben sich vom farbigen Hintergrund ab. Aufgestellt werden die Karten selbst zu einer kleinen Weihnachtsdekoration.

  Sie eignen sich für persönliche Festtagsgrüße an Familie und Freunde oder als Aufmerksamkeit für Kunden und Kollegen. Welches Motiv und welche Gestaltung zu deinem Gruß passen, besprechen wir mit dir. Wenn du einen eigenen Text ergänzen möchtest, stimmen wir die Möglichkeiten gemeinsam ab.
tags:
  - Weihnachten
  - Dankeschön
  - Vereine & Firmen
date: '2024-01-21'
