id: deko_aufsteller
name: Deko-Aufsteller
description: |
  Filigrane Motive auf einem Holzsockel machen diese Deko-Aufsteller zu kleinen Blickfängen für Regal, Kommode oder Fensterbank. Die Beispiele zeigen Blumen mit Herz, persönliche Schriftzüge und winterliche Motive. Durch die ausgeschnittenen Formen wirken die Aufsteller leicht und lassen sich gut mit anderer Dekoration kombinieren.

  Mit einer Widmung am Sockel oder einem passenden Motiv entsteht ein persönlicher Gruß für einen Lieblingsmenschen. Auch saisonale Ideen lassen sich aufgreifen. Welche Beschriftung und Motivkombination zu deinem Wunsch passt, besprechen wir im persönlichen Kontakt.
