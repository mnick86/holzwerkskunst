id: foto_lineart
name: Foto graviert - Line Art
description: |
  Ein persönliches Foto wird als Linienzeichnung auf Holz verewigt. Bei dieser Line-Art-Gestaltung stehen die Konturen und der Ausdruck der abgebildeten Menschen im Mittelpunkt. Die natürliche Holzoberfläche verleiht dem Motiv einen warmen Hintergrund; die Beispiele zeigen Paar- und Familienporträts im Bilderrahmen.

  Ein Name, ein Datum oder ein kurzer Schriftzug kann die Erinnerung ergänzen. Das macht die Fotogravur zu einer Geschenkidee für Hochzeiten, Familienfeste oder einen besonderen Jahrestag. Welches Foto sich für deine gewünschte Darstellung eignet, klären wir vorab gemeinsam.
