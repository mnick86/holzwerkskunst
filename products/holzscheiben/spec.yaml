id: holzscheiben
name: Holzscheiben graviert
description: |
  Die natürliche Form und der sichtbare Rand machen jede Holzscheibe zu einem besonderen Hintergrund für deine Gravur. Ob Namen und Geburtsdaten, ein Hochzeitsmotiv, ein persönlicher Spruch oder ein Foto: Die Gestaltung lässt sich auf einen wichtigen Menschen oder Moment beziehen.

  Die Beispiele zeigen Erinnerungen zur Geburt, persönliche Bildgravuren und Geschenke zur Hochzeit. Eine Holzscheibe kann als Dekoration und als bleibender Gruß verschenkt werden. Welches Motiv auf die jeweilige Scheibe passt und wie dein Text angeordnet wird, stimmen wir vorab mit dir ab.
tags:
