id: kreuz
name: Kreuz
description: |
  Ein persönliches Holzkreuz begleitet die Erinnerung an Taufe oder Kommunion. Ein Name, ein Segensspruch und passende Symbole verbinden sich zu einer Gestaltung, die auf das Kind und den besonderen Tag abgestimmt ist. Die Beispiele zeigen zusätzlich hervorgehobene Namensschriftzüge und Motive wie Fisch, Taube oder Regenbogen.

  Ob als Geschenk von Familie oder Paten: Mit wenigen persönlichen Angaben bekommt das Kreuz seine eigene Bedeutung. Den gewünschten Namen, den Spruch und die Anordnung der Motive besprechen wir gemeinsam mit dir.
tags:
