id: kommunionsfische
name: Kommunionsfische
description: |
  Ein Fisch aus Holz ist ein passendes Symbol für Kommunion und Taufe. Die ausgeschnittene Form wird mit einem Namen, dem Datum der Feier oder einem kurzen Dankesgruß graviert. So entsteht ein kleines Erinnerungsstück mit einem direkten Bezug zum Fest.

  Die Fische lassen sich auf dem Tisch arrangieren oder als persönliche Aufmerksamkeit an Gäste weitergeben. Die abgebildeten Varianten zeigen einen Dankeschön-Text zur Kommunion. Wir besprechen mit dir, welche Beschriftung und Anzahl du dir für deine Feier wünschst.
tags:
  - Geschenk
  - Kommunion
  - Taufe
  - Dankeschön
date: '2024-03-14'
