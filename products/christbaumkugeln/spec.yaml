id: christbaumkugeln
name: Christbaumkugeln
description: |
  Diese Christbaumkugeln aus Holz bringen persönliche Namen und Motive an den Weihnachtsbaum. Die offene, filigrane Form lässt die Zweige und Lichter dahinter sichtbar bleiben. Ob ein geschwungener Name oder ein humorvoller Schriftzug: Jede Gestaltung setzt einen eigenen Akzent zwischen den klassischen Kugeln.

  Die Anhänger eignen sich auch als kleine Aufmerksamkeit in der Adventszeit oder als persönlicher Schmuck an einem Weihnachtsgeschenk. Teile uns deinen Wunschnamen oder deine Idee mit, und wir stimmen die Ausführung gemeinsam ab.
tags:
