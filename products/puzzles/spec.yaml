id: puzzles
name: Puzzles
description: |
  Bei diesen Holzpuzzles bekommen einzelne Motive ihren eigenen Platz auf einer passenden Grundplatte. Tiere, Lebensmittel und andere Formen laden zum Zuordnen und Entdecken ein. Die Motive können von Hand bemalt werden; die Bilder zeigen Beispiele mit farbig gestalteten Puzzleteilen.

  Mit einem Namen auf der Grundplatte wird das Puzzle zu einem persönlichen Geschenk, etwa zum Geburtstag. Motivwelt und Beschriftung besprechen wir mit dir. Wenn du eine bestimmte Idee oder ein Lieblingsthema aufgreifen möchtest, stimmen wir gemeinsam ab, welche Gestaltung dafür möglich ist.
tags:
  - Geschenk
  - Geburtstag
date: '2024-01-07'
