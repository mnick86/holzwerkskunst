id: duplobox
name: Duplo Boxen
description: |
  Eine kleine Süßigkeit und ein passender Spruch ergeben zusammen eine persönliche Aufmerksamkeit. Diese Holzboxen sind auf einen Duplo-Riegel abgestimmt und setzen die Botschaft auf dem Deckel in Szene. Die sichtbare Verpackung lässt sich dabei spielerisch in den Text einbeziehen.

  Ob liebevoll, frech oder mit bayerischem Humor: Namen und kurze Sprüche geben jeder Box ihren eigenen Ton. Sie eignen sich als kleines Dankeschön, als Mitbringsel oder als Aufmerksamkeit für Gäste, Kollegen und Vereinsmitglieder. Die Beschriftung und die gewünschte Stückzahl stimmen wir mit dir ab.
tags:
