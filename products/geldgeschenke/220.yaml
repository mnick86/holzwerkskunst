description: 'Holzplakette mit ausgeschnittenem Schriftzug "Taufe", dahinter
  scheinen Geldscheine durch, dazu geschnittene Wünsche: "Alles Liebe zur Taufe"
  und "Möge dein Leben voller Liebe und ohne Sorge sein". Umgeben von
  getrockneten Rosen, einer Bibel und einem Kreuz-Anhänger mit Schleife.'
