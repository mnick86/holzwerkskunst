id: geldgeschenke
name: Geldgeschenke
description: |
  Geld verschenken darf persönlich und einfallsreich sein. Bei diesen Geldgeschenken aus Holz werden die Scheine Teil der Gestaltung: Sie schimmern durch ausgeschnittene Motive oder ergänzen eine Botschaft. Ob Wunscherfüller, Hochzeitsgruß, Geburtstagsidee oder Geschenk zur Geburt – das Motiv macht den Anlass erkennbar.

  Namen, ein Datum und persönliche Worte geben dem Geschenk eine eigene Geschichte. Die vielen Beispiele in der Galerie zeigen unterschiedliche Formen und Themen. Wir stimmen mit dir ab, wie dein Geldgeschenk gestaltet werden soll und welche Beschriftung dazu passt.
