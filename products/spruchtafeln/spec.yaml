id: spruchtafeln
name: Spruchtafeln
description: |
  Ein schöner Gedanke verdient einen sichtbaren Platz. Auf diesen Spruchtafeln werden Worte und Motive auf Schiefer oder Fliesen gestaltet. Die Beispiele reichen vom Segenswunsch für das Zuhause über einen Lebensbaum bis zum bayerischen „Dahoam“-Motiv.

  Ob für den Eingangsbereich, einen Lieblingsplatz oder als persönlicher Gruß zum Einzug: Ein passender Spruch macht die Tafel zu einem Geschenk mit Bedeutung. Du kannst uns deinen Wunschtext oder eine Motividee nennen. Die Materialvariante und die Anordnung von Schrift und Bild stimmen wir mit dir ab.
