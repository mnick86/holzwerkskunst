id: lesezeichen
name: Lesezeichen
description: |
  Ein persönliches Lesezeichen begleitet kleine und große Lesemomente. Die Holzlesezeichen lassen sich mit Namen, kurzen Botschaften und passenden Motiven gestalten. Die abgebildeten Varianten zeigen Schriftzüge zum Schulstart sowie dekorative Bänder und Quasten.

  Als Aufmerksamkeit zur Einschulung, zum Geburtstag oder als Dankeschön bekommt das Lesezeichen einen persönlichen Bezug. Es passt zu einem Buchgeschenk und lässt sich auch einzeln verschenken. Namen, Text und die gewünschten Gestaltungsdetails besprechen wir mit dir, damit dein Lesezeichen zur beschenkten Person passt.
tags:
