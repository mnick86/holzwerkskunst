id: aufsteller_schiefer
name: Aufsteller aus Schiefer
description: |
  Dunkler Schiefer und ein heller Holzsockel machen diese Aufsteller zu einem Blickfang im Eingangsbereich, auf der Kommode oder am Lieblingsplatz. Die gravierten Schriftzüge und Motive kommen auf der Schieferoberfläche deutlich zur Geltung. Kleine Herzdetails am Sockel runden die Gestaltung ab.

  Ein Willkommensgruß, ein persönlicher Spruch oder ein Motiv mit Namen verleiht dem Aufsteller seine eigene Bedeutung. So entsteht eine Dekoration für dein Zuhause oder ein persönliches Geschenk zum Einzug, zur Hochzeit oder zum Geburtstag. Deinen Wunschtext und die Gestaltung stimmen wir gemeinsam ab.
tags:
