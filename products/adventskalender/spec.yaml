id: adventskalender
name: Steckbare Adventskalender
description: |
  Mit diesem steckbaren Adventskalender wird das Warten auf Weihnachten jeden Tag ein kleines Stück kürzer. Die nummerierte Holzleiste zählt die Tage bis zum Fest, während eine steckbare Figur den aktuellen Tag markiert. Ob Dinosaurier, Eule oder weihnachtliches Motiv: Die Figur lässt sich passend zu deinen Wünschen auswählen.

  Auf einer Fensterbank, einem Regal oder dem festlich gedeckten Tisch findet der Kalender seinen Platz. Eine persönliche Alternative zum klassischen Adventskalender, bei der das gemeinsame Zählen und die Vorfreude im Mittelpunkt stehen.
tags:
