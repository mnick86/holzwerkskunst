id: menuekarte
name: Menükarte
description: |
  Eine Menükarte aus Holz gibt dem Festessen einen besonderen Rahmen. Die gravierten Speisen und Getränke bleiben gut sichtbar auf dem Tisch, während florale Motive oder ein passender Schriftzug die Gestaltung ergänzen. Das gezeigte Beispiel verbindet eine aufgestellte Holzkarte mit einer festlichen Tischdekoration.

  Ob Hochzeit, runder Geburtstag, Taufe oder Kommunion: Text und Stil lassen sich auf deine Feier abstimmen. Du teilst uns die gewünschte Menüfolge und deine Gestaltungsideen mit. Gemeinsam besprechen wir die Anordnung der Texte und die benötigte Anzahl.
