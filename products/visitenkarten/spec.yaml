id: visitenkarten
name: Visitenkarten aus Holz
description: |
  Visitenkarten aus Holz bleiben durch ihre natürliche Oberfläche und die gravierte Gestaltung im Gedächtnis. Namen, Kontaktdaten und ein passendes Motiv werden direkt auf das Holz gebracht. Das gezeigte Beispiel verbindet die Kontaktdaten eines Musikers mit einer Akkordeonzeichnung.

  Ob für einen kleinen Betrieb, ein kreatives Angebot oder einen persönlichen Auftritt: Die Gestaltung kann auf deine Tätigkeit abgestimmt werden. Du lieferst uns die gewünschten Angaben und gegebenenfalls ein Motiv oder Logo. Gemeinsam klären wir, wie die Informationen übersichtlich und gut lesbar angeordnet werden.
