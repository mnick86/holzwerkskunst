id: gastgeschenk
name: Gastgeschenke
description: |
  Mit einem kleinen Gastgeschenk sagst du deinen Gästen auf persönliche Weise Danke. Die Holzhalter setzen eine kleine Süßigkeit in Szene und lassen sich mit einer Botschaft oder einem Namensdetail gestalten. Auf einem gedeckten Platz werden sie zugleich Teil der Tischdekoration.

  Die Beispiele zeigen weihnachtliche und österliche Varianten. Auch für Hochzeiten, Geburtstage oder Familienfeiern lässt sich eine passende Idee abstimmen. Motiv, Beschriftung und die gewünschte Anzahl besprechen wir mit dir, damit die Aufmerksamkeit zu deinen Gästen und zum Anlass passt.
